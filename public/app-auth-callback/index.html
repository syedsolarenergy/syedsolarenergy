<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opening Solar Olagawa…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Arial,system-ui,-apple-system,Segoe UI,Roboto;margin:0;padding:24px;background:#FFFBE6;color:#333}
    .card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #FFE0B2;border-radius:12px;padding:24px;text-align:center}
    .btn{display:inline-block;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}
    .primary{background:#E65100;color:#fff}
    .muted{color:#888;font-size:12px;margin-top:14px}
  </style>
  <script>
    (function () {
      // Supabase sends query params: ?type=recovery&access_token=...&refresh_token=...
      var qs = window.location.search || '';
      var appUrl = 'olagawa://auth-callback' + qs;

      // Try to open the app immediately
      window.location.replace(appUrl);

      // Fallback UI in case the app doesn’t capture the deep link
      setTimeout(function(){
        document.getElementById('fallback').style.display = 'block';
        document.getElementById('openApp').href = appUrl;
      }, 1500);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h2 style="color:#E65100;margin:0 0 8px">Opening Solar Olagawa…</h2>
    <p style="margin:0 0 16px">If the app doesn’t open automatically, tap the button below.</p>
    <div id="fallback" style="display:none;">
      <a id="openApp" class="btn primary" href="#">Open in App</a>
      <p class="muted">If the app is not installed, open it from your apps and try again.</p>
    </div>
  </div>
</body>
</html>
